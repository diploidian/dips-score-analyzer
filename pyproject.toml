[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectArthas"
version = "0.21.0"
description = "Scores a WoW dungeon run from the projectArthas addon's input log and WoWCombatLog.txt"
requires-python = ">=3.13"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
projectArthas = "dips_score.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
