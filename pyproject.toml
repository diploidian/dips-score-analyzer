[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dips-score"
version = "0.14.0-a"
description = "Scores a WoW dungeon run from the dips-Score addon's input log and WoWCombatLog.txt"
requires-python = ">=3.13"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
dips-score = "dips_score.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
